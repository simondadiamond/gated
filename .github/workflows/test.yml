name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gated:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s skills/gated/tests -t skills/gated/tests -v
      - name: Example workflows lint
        run: |
          for w in skills/gated/workflows/*/; do
            python skills/gated/bin/gated lint "$w"
          done
